# This file orchestrates our multi-container architecture seamlessly
services:
  backend_fast_api:
    build:
      context: . # Look at my local directory, read the custom Dockerfile, and compile the python app image
    container_name: backend_fast_api
    ports:
      - '8000:8000' # Map your physical Mac port 8000 to the container's FastAPI network layer
    volumes:
      - .:/app # Bind-mounts your current local folder right inside the container for live editing
    env_file:
      - .env # Streams local system environment configurations safely
    networks:
      - care_network # Mounts this container onto our isolated network bridge switch
    depends_on:
      - ollama_node # Ensures the AI compute core initializes before the web API tries to boot up
    
  ollama_node:
    image: ollama/ollama:latest # Download the official pre-packaged software from Docker Hub registry
    container_name: coordinator_bonnie
    ports:
      - '11434:11434' # Reconfigured to match standard internal Ollama routing ports
    volumes:
      - ollama_storage:/root/.ollama # Plugs this container's cache right into our persistent disk volume vault
    networks:
      - care_network # Mounts this container onto the same network bridge for internal DNS ping routing

# Manufacture global structural infrastructure components
volumes:
  ollama_storage: # Automatically digs and configures the long-term disk storage partition on this local machine

networks:
  care_network: # Automatically manufactures the virtual isolated software routing switch bridge
    driver: bridge